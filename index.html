<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日课</title>
  <meta name="theme-color" content="#F6F8F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日课">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23B3332B'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E8%AA%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/day"><span class="brand-seal" aria-hidden="true">日課</span><span>日课</span></a>
      <nav class="nav" aria-label="页面">
        <a href="#/day" data-view="day">今日</a>
        <a href="#/week" data-view="week">本周</a>
        <a href="#/month" data-view="month">本月</a>
        <a href="#/report" data-view="report">周报</a>
        <a href="#/settings" data-view="settings">固定事项</a>
      </nav>
      <p class="sync-status" id="syncStatus" aria-live="polite"></p>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
